<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tıp Sınavları - FTR, Beyin Cerrahisi, Ortopedi, KBB & Dermatoloji</title>
    <style>
        :root {
            --primary: #2563eb; --primary-dark: #1e40af;
            --bg: #f8fafc; --card: #ffffff;
            --text: #0f172a; --text-light: #64748b;
            --border: #e2e8f0; --success: #22c55e;
            --error: #ef4444; --header-height: 60px;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }

        /* ===== SINAV SEÇİM EKRANI ===== */
        #exam-select-screen { min-height: 100vh; padding: 2rem 1rem; max-width: 700px; margin: 0 auto; }
        .site-title { text-align: center; margin-bottom: 0.3rem; font-size: 1.5rem; color: var(--text); }
        .site-subtitle { text-align: center; color: var(--text-light); font-size: 0.95rem; margin-bottom: 2rem; }
        .search-box { margin-bottom: 1.2rem; }
        #exam-search {
            width: 100%; padding: 0.9rem 1.1rem; font-size: 1rem; font-family: inherit;
            border: 2px solid var(--border); border-radius: 12px; background: var(--card); color: var(--text);
            outline: none; transition: 0.2s;
        }
        #exam-search:focus { border-color: var(--primary); }
        .exam-item .exam-match { color: var(--primary); font-size: 0.8rem; margin-top: 0.25rem; font-weight: 500; }
        .no-result { text-align: center; color: var(--text-light); padding: 2rem 1rem; }
        .exam-list { display: flex; flex-direction: column; gap: 0.8rem; }
        .exam-category {
            font-weight: 700; font-size: 0.9rem; color: var(--primary);
            text-transform: uppercase; letter-spacing: 0.04em;
            margin: 1.2rem 0 0.1rem; padding-bottom: 0.4rem; border-bottom: 2px solid var(--border);
        }
        .exam-category:first-child { margin-top: 0; }
        .exam-item {
            background: var(--card); border: 2px solid var(--border); border-radius: 12px;
            padding: 1.1rem 1.3rem; cursor: pointer; transition: 0.2s;
            display: flex; justify-content: space-between; align-items: center;
        }
        .exam-item:hover, .exam-item:active { border-color: var(--primary); background: #eff6ff; }
        .exam-item .exam-title { font-weight: 600; font-size: 1rem; }
        .exam-item .exam-desc { color: var(--text-light); font-size: 0.85rem; margin-top: 0.2rem; }
        .exam-item .arrow { color: var(--primary); font-size: 1.3rem; font-weight: bold; }

        /* ===== MOBİL HEADER ===== */
        .mobile-header {
            position: fixed; top: 0; left: 0; width: 100%; height: var(--header-height);
            background: var(--card); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 1rem; z-index: 100;
        }
        .mobile-header h1 { font-size: 1rem; margin: 0; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
        .menu-btn { background: none; border: none; font-size: 1.5rem; color: var(--primary); cursor: pointer; padding: 5px 10px; }

        .main-container { padding: calc(var(--header-height) + 1rem) 1rem 1rem; }
        .quiz-card { background: var(--card); padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 2rem; }

        .question-text { font-size: 1.1rem; font-weight: 600; line-height: 1.5; margin-bottom: 1.5rem; color: #1e293b; }
        .options-container { display: flex; flex-direction: column; gap: 0.8rem; }
        .option {
            padding: 1rem; border: 2px solid var(--border); border-radius: 10px;
            cursor: pointer; transition: 0.2s; position: relative;
            font-size: 0.95rem; line-height: 1.4;
        }
        .option:active { background: #f1f5f9; }
        .option.selected { border-color: var(--primary); background: #eff6ff; }
        .option.correct { border-color: var(--success) !important; background: #f0fdf4 !important; color: #166534; font-weight: 500;}
        .option.wrong { border-color: var(--error) !important; background: #fef2f2 !important; color: #991b1b; }

        .nav-controls { margin-top: 2rem; display: flex; justify-content: space-between; gap: 10px; }
        button { padding: 0.7rem 1.2rem; border-radius: 8px; cursor: pointer; font-weight: 600; border: none; font-size: 0.95rem; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; flex: 1; text-align: center;}
        .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
        .btn-primary:disabled { background: #cbd5e1; cursor: not-allowed; }
        .btn-secondary { background: #e2e8f0; color: #475569; }
        .btn-finish { background: #dc2626; color: white; width: 100%; margin-top: 10px;}
        .btn-home { background: #f1f5f9; color: #475569; width: 100%; margin-top: 10px; border: 1px solid var(--border);}

        /* ===== SIDEBAR ===== */
        .sidebar {
            position: fixed; top: 0; left: -100%; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5); z-index: 200;
            transition: 0.3s; opacity: 0; visibility: hidden;
        }
        .sidebar.open { left: 0; opacity: 1; visibility: visible; }
        .sidebar-content {
            width: 85%; max-width: 300px; height: 100%;
            background: var(--card); padding: 1.2rem;
            display: flex; flex-direction: column;
            box-shadow: 4px 0 10px rgba(0,0,0,0.1);
        }
        .sidebar h3 { font-size: 1.1rem; margin: 0 0 1rem; padding-bottom: 0.5rem; border-bottom: 2px solid var(--bg); display: flex; justify-content: space-between; align-items: center;}
        .close-menu-btn { background: none; border: none; font-size: 1.5rem; color: #64748b; cursor: pointer; padding: 5px; }
        .question-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(36px, 1fr));
            gap: 8px; overflow-y: auto; padding-bottom: 20px;
            flex: 1; align-content: start;
        }
        .q-badge {
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 8px; border: 1px solid var(--border);
            cursor: pointer; font-size: 0.85rem; transition: 0.2s;
            font-weight: 500; color: var(--text-light);
            margin: 0 auto;
        }
        .q-badge.active { border-color: var(--primary); background: #eff6ff; font-weight: bold; color: var(--primary); box-shadow: 0 0 0 2px var(--primary); }
        .q-badge.answered { background: var(--primary); color: white; border-color: var(--primary); }

        #result-screen { display: none; padding-bottom: 5rem; }
        .review-item { margin-bottom: 1.5rem; padding: 1rem; border-radius: 10px; border: 1px solid var(--border); background: white; font-size: 0.9rem;}

        @media (min-width: 992px) {
            body.quiz-mode { display: flex; height: 100vh; }
            body.quiz-mode .mobile-header { display: none; }
            body.quiz-mode .sidebar {
                position: static; width: 300px; left: 0 !important; opacity: 1 !important; visibility: visible !important;
                background: var(--card); border-right: 1px solid var(--border);
            }
            body.quiz-mode .sidebar-content { width: 100%; box-shadow: none; padding: 1.5rem; }
            body.quiz-mode .main-container { flex: 1; padding: 2rem; overflow-y: auto; display: flex; align-items: center; justify-content: center; }
            body.quiz-mode .quiz-card { max-width: 800px; width: 100%; padding: 2rem; margin-bottom: 0;}
            body.quiz-mode #q-grid { grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 10px; align-content: start; }
            body.quiz-mode .q-badge { width: 40px; height: 40px; }
            body.quiz-mode .close-menu-btn { display: none; }
            #exam-select-screen { padding-top: 4rem; }
        }
    </style>
</head>
<body>

<!-- ===== SINAV SEÇİM EKRANI ===== -->
<div id="exam-select-screen">
    <h1 class="site-title">Çıkmış Sınav Soruları</h1>
    <p class="site-subtitle">FTR · Beyin Cerrahisi · Ortopedi · KBB · Dermatoloji — Girmek istediğiniz sınavı seçin</p>
    <div class="search-box">
        <input type="search" id="exam-search" placeholder="Sınav veya soru ara… (ör. KBB, 2. Döngü, psoriasis)" oninput="renderExamList(this.value)" autocomplete="off">
    </div>
    <div class="exam-list" id="exam-list"></div>
</div>

<!-- ===== QUIZ EKRANI ===== -->
<header class="mobile-header" id="quiz-header" style="display:none;">
    <span id="mobile-progress" style="color: var(--text-light); font-size: 0.9rem;">Soru 1</span>
    <h1 id="header-title">Quiz</h1>
    <button class="menu-btn" onclick="toggleSidebar()">&#9776;</button>
</header>

<div class="sidebar" id="sidebar" style="display:none;" onclick="closeSidebar(event)">
    <div class="sidebar-content" onclick="event.stopPropagation()">
        <h3>
            <span>Sorular</span>
            <button class="close-menu-btn" onclick="toggleSidebar()">&#10005;</button>
        </h3>
        <div class="question-grid" id="q-grid"></div>
        <div class="sidebar-footer">
            <button class="btn-finish" onclick="finishQuiz()">Sınavı Bitir</button>
            <button class="btn-home" onclick="goHome()">&#8592; Ana Sayfa</button>
        </div>
    </div>
</div>

<main class="main-container" id="quiz-area" style="display:none;">
    <div class="quiz-card">
        <div class="question-text" id="question">Soru yükleniyor...</div>
        <div class="options-container" id="options"></div>
        <div class="nav-controls">
            <button class="btn-secondary" id="prev-btn" onclick="prevQuestion()">&#8592; Geri</button>
            <button class="btn-primary" id="next-btn" onclick="nextQuestion()">Sonraki &#8594;</button>
        </div>
    </div>
</main>

<main class="main-container" id="result-screen">
    <div class="quiz-card" style="max-width: 900px; margin: 0 auto;">
        <h2 style="text-align: center; margin-top: 0;">Sınav Sonucu</h2>
        <div id="score-summary" style="text-align: center; font-size: 1.4rem; font-weight: bold; margin-bottom: 2rem; color: var(--primary);"></div>
        <div id="review-list"></div>
        <button class="btn-primary" style="width: 100%; margin-top: 2rem; display: block; padding: 1rem;" onclick="restartExam()">Sınavı Yeniden Başlat</button>
        <button class="btn-home" style="padding: 1rem;" onclick="goHome()">&#8592; Ana Sayfaya Dön</button>
    </div>
</main>

<script>
/* ============================================================
   YENİ SINAV EKLEME:
   Aşağıdaki EXAMS dizisine yeni bir blok ekleyin. Şablon:

   {
       category: "Ders Adı",   // ana sayfada başlık olarak gruplanır (boşsa "FTR & Beyin Cerrahisi")
       title: "Yeni Sınavın Adı",
       desc: "32 soru",   // listede görünen açıklama (serbest metin)
       questions: [
           { "q": "Soru metni?", "a": ["DOĞRU cevap", "yanlış", "yanlış", "yanlış", "yanlış"] },
           ...
       ]
   },

   ÖNEMLİ: Her sorunun "a" dizisinde İLK eleman DOĞRU cevaptır.
   Şıklar sınav sırasında otomatik karıştırılır.
   Aynı kategorideki sınavlar listede art arda durmalıdır.
   ============================================================ */
const EXAMS = [
    {
        title: "I. Sınav Grubu (Soru 60 - 91)",
        desc: "32 soru",
        questions: [
        {"q": "C6 radikülopati tespit edilen bir hastada aşağıdaki bulgulardan hangisi beklenmez?", "a": ["Spastisite", "El bilek ekstansiyonunda kuvvet kaybı", "Baş parmak ve işaret parmağı duyu kaybı", "Spurling testinde ağrı artışı", "Brakioradial refleks kaybı"]},
        {"q": "Kalça osteoartriti ile ilgili aşağıdaki ifadelerden hangisi yanlıştır?", "a": ["Kadınlarda daha sık görülür.", "En sık supero-lateral bölge tutulur.", "Ağrı sıklıkla kasığa yansır.", "Obezite risk faktörlerindendir.", "Kalça fleksiyon ve iç rotasyonu kısıtlanır."]},
        {"q": "Otuz yaşında, yaygın ağrı ve yorgunluk tarifleyen, depresif bulguları olan, laboratuvar değerlendirmeleri normal olan kadın hastanın yaygın ağrı skalası: 8, semptom şiddet skalası: 5 olarak belirleniyor. Bu hastada aşağıdaki ajanlardan hangisi tedavi için uygundur?", "a": ["Duloksetin", "Fluoksetin", "Paroksetin", "Sertralin", "Essitalopram"]},
        {"q": "Romatizmal hastalıklara ait klinik bulgular ile bazı spesifik antikorlar arasında ilişki mevcuttur. Bu konu ile ilgili aşağıdakilerden hangisi yanlıştır?", "a": ["Anti-Sm ilaca bağlı lupus sendromunda yüksek duyarlılığa sahiptir", "Anti-U1RNP (titresi >1:1600) miks konnektif doku hastalığı (MKDH) Alarcon-Segovia tanısal kriterleri arasında yer almaktadır", "Anti-ds-DNA pozitifliği, lupus nefrit riskini arttırır.", "Ribozomal P proteini SLE tanısı için yüksek spesifiteye sahiptir", "RNA Polimeraz III sistemik sklerozlu hastalarda renal kriz eğilimini yükseltir"]},
        {"q": "Aşağıdakilerden hangisi ailevi akdeniz ateşi (FMF) tedavisi için yanlıştır?", "a": ["FMF'li bir hastada amiloidoz geliştikten sonra kolşisin amiloidozu yavaşlatmada etkili değildir.", "Kolşisin atakları önlemede ve subklinik inflamasyonu kontrol etmede etkilidir.", "Kolşisinin dozu peritonit atağında arttırılırsa gastrointestinal yan etkisi nedeni ile abdominal atağın şiddetini arttırabilir.", "Kolşisine dirençli vakalarda IL-1 inhibitörleri kullanılabilir.", "FMF'li hastalarda anti-tümör nekroz faktör (Anti TNF-α) ajanlar özellikle kronik artrit ve sakroileit gibi kas iskelet sistemi tutulumlarında etkili olabilir."]},
        {"q": "On yıldır primer Sjogren Sendromu tanısı ile takip edilmekte olan 55 yaşındaki kadın hastanın, son 3 aydır halsizlik ve parotis bezinde şişlik yakınması ile birlikte fizik muayenesinde posterior servikal lenf bezlerinde büyüme olduğu izlenmektedir. Laboratuvar bulguları içerisinde lökopeni ve düşük kompleman C4 düzeyleri gözlenmektedir. En olası ön tanınız aşağıdakilerden hangisi olmalıdır?", "a": ["Lenfoma", "HIV enfeksiyonu", "Amiloidoz", "Kronik pankreatit", "Sekonder Sjogren Sendromu"]},
        {"q": "Romatoid artrit için aşağıdaki laboratuvar bulgularından hangisi daha spesifiktir?", "a": ["Anti-siklik sitrüline peptit (Anti-CCP) antikoru", "Yüksek akut faz reaktanı", "Romatoid faktör", "Kronik hastalık anemisi", "Trombositoz"]},
        {"q": "Kas kuvveti değerlendirmesinde, test edilen kas ancak yer çekimini ortadan kaldıran bir pozisyona getirildiğinde hareket edebiliyorsa fizik tedavi programında aşağıdaki egzersiz tiplerinden hangisini vermek uygundur?", "a": ["Aktif-asistif", "Pasif", "Aktif", "Progresif-dirençli", "İzotonik"]},
        {"q": "İki ay önce sağ orta serebral arter infarktı nedeniyle kuvvet kaybı gelişen immobil hemiplejik hastanın yatak içi pozisyonlaması ile ilgili aşağıdaki yaklaşımlardan hangisi uygun değildir?", "a": ["Sol diz, diz altına yastık konularak desteklenmelidir.", "Sol kalçanın dış rotasyonuna engel olmak için bacak dıştan desteklenmelidir.", "Sağ yanına yatarken, sol omuz 90 derece fleksiyonda ve dirsek ekstansiyonda olmalıdır.", "Sol ayak bileği nötral pozisyonda tutulmalıdır.", "Kalça ve diz fleksiyon kontraktürlerini önlemek için hasta aralıklı yüzükoyun yatırılır."]},
        {"q": "Yüksekten düşme sonucu C8 seviyesinde komplet spinal kord yaralanması gelişen bir hastada aşağıdakilerden hangisi beklenmez?", "a": ["Transferlerde tam bağımlılık", "İnspiryum ve ekspiryum bozukluğu", "Otonomik disrefleksi", "Postural hipotansiyon", "Nörojen mesane"]},
        {"q": "Aşağıdakilerden hangisi osteoporoz için bir risk faktörü değildir?", "a": ["Obezite", "Sigara kullanımı", "Hipertiroidi", "Romatoid Artrit", "Proton pompa inhibitörleri kullanımı"]},
        {"q": "Pençe el deformitesi aşağıdaki tuzak nöropatilerden hangisinde görülebilir?", "a": ["Kübital tünel sendromu", "Karpal tünel sendromu", "Pronator teres sendromu", "Anterior interossöz sendrom", "Posterior interossöz sendrom"]},
        {"q": "45 yaşında kadın hasta 2 gündür devam eden şiddetli omuz ağrısı varmış. Travma öyküsü yok. Ağrısının giderek arttığını kolunu kaldıramadığını belirtiyor. Muayenesinde: omuz hareketleri her yönde ağrılı, kısıtlı. Hastanın omuz grafisinde kalsifikasyonlar izlenmektedir. Bu hastada tanınız nedir?", "a": ["Kalsifik tendinit", "Adeziv kapsülit", "Biseps tendon rüptürü", "Supraspinatus rüptürü", "Akromiyoklaviküler artrit"]},
        {"q": "Bel ağrıları ile ilgili hangi ifade yanlıştır?", "a": ["En fazla fıtık gelişen seviye L3-4 seviyesidir", "İnflamatuar bel ağrısı istirahatte belirginleşir", "Maligniteye bağlı ağrılarda genelde metastaz sonrası gelişir", "İleri yaşlarda en sık sebep dejeneratif osteoartrittir", "En sık sebep mekanik patolojilerdir."]},
        {"q": "Nöropatik ağrıda ilk sırada kullanılacak ilaç aşağıdakilerden hangisidir?", "a": ["Amitriptilin", "Diklofenak Na", "Tiyokolsikoid asit", "B1-B6 vit kompleksi", "Kolsisin"]},
        {"q": "Romatoid artritte antijenin sunumu engelleyerek T hücre ko-inhibisyonu yapan medikal tedavi aşağıdakilerden hangisidir?", "a": ["Abatacept", "Adalimumab", "Etanercept", "Rituksimab", "İnfliksimab"]},
        {"q": "Aşağıdaki muayene yöntemlerinden hangisi sadece kalça eklem patolojilerinin değerlendirilmesinde kullanılır?", "a": ["FADIR", "Cox bulgusu", "Bregard belirtisi", "Mennel testi", "Laseque testi"]},
        {"q": "Lomber disk hernilerinde aşağıdakilerden hangisinde mutlak cerrahi gereklidir?", "a": ["İlerleyici nörolojik defisit olması", "Bel hareketlerinin her yöne kısıtlı olması", "L5 dermatomunda hipoestezi", "Düz bacak kaldırma testinde ilk 30 derecede ağrı olması", "Hastanın ağrısının şiddetli olması"]},
        {"q": "62 yaşında bayan hasta sağ dizde 10 gündür devam eden şişlik ve ağrı şikayeti ile geliyor. F.M sağ dizde efüzyon ve ısı artışı mevcut. Eklem hareketi kısıtlanmış, laboratuvar incelemesinde Akut faz yanıtını yüksek, diğer parametreler normal sınırlarda. Çekilen grafisi görselde kalsifikasyonlar (kondrokalsinozis) gösteren hastanın olası ön tanısı nedir?", "a": ["Pseudogut", "Septik artrit", "Osteoartrit", "Gut", "Sinovyal kondromatozis"]},
        {"q": "I) Sakroiliit II) Patellar tendinit III) Benekli osteoporoz IV) Baker kisti Yukarıdaki patolojilerden hangileri USG'de izlenebilir?", "a": ["II, IV", "I, II", "II, III", "I, II, III", "I, III, IV"]},
        {"q": "Aşağıdakilerden hangisi gut hastalığı tedavisinde ürik asit yapımını azaltarak etki gösterir?", "a": ["Febuksostat", "Probenesid", "Benzbromaron", "Peglotikaz", "Rilonasept"]},
        {"q": "Aşağıdakilerden hangisi ankilozan spondilitte izlenen radyografik bulgulardan değildir?", "a": ["Çıkma kenar lezyonu", "Faset ankilozları", "Kalkaneal erozyon", "Pubis kollarında düzensizlik", "Koksofemoral eklem aralığında daralma"]},
        {"q": "Aşağıdaki anatomik yapıların sayıları hakkında hangisi doğrudur? Foramen monro (FM), Aquaductus sylvi (AS)", "a": ["İki FM, Bir AS", "Bir FM, İki AS", "İki FM, İki AS", "Bir FM, Bir AS", "Üç FM, İki AS"]},
        {"q": "SSS tümörleri ile ilgili verilen bilgilerden hangisi yanlıştır?", "a": ["SSS tümörlerinin başka organ metastazları sık görülür.", "Cerrahi rezeksiyon sınırlı olabilir.", "Klinik genel semptomlar dışında yerleşim ile ilgilidir.", "Benign-malign ayrımı daha az belirgindir.", "Metastazlar en sık SSS tümörleridir."]},
        {"q": "Nörojenik ve vasküler kladikasyo ayırıcı tanısında aşağıda verilen bilgilerden hangisi yanlıştır?", "a": ["Vasküler kladikasyoda ağrı postüre bağlıdır. Fleksiyon postürde şikayetler azalır.", "Nörojenik kladikasyonda ağrı daha çok dermatomal olur.", "Ayak eleve edilince vasküler patolojide ayak soluklaşır.", "Nabız değişiklikleri vasküler patolojilerde olur.", "Nörojenik kladikasyoda şikayetler sıklıkla ilerleyicidir."]},

        {"q": "Liken planusta görülen primer lezyon hangisidir?", "a": ["Mor menekşe papül", "Püstül", "Beyaz skuamlı plaklar", "Bül", "Erozyon"]},
        {"q": "Aşağıdaki bölgelerden hangisinde topikal uygulanan bir kremin emilme oranı daha yüksektir?", "a": ["Mukoz membranlar", "Skrotum", "Yüz", "Palmoplantar deri", "Göğüs – sırt"]}

let currentExam = null;
let currentIdx = 0;
let quizFinished = false;
let quizData = [];
let userAnswers = [];

/* ===== ANA SAYFA ===== */
function normTR(t) {
    return String(t).replace(/<[^>]*>/g, " ").replace(/İ/g, "i").replace(/I/g, "ı").toLocaleLowerCase("tr");
}

function renderExamList(filter = "") {
    const list = document.getElementById("exam-list");
    list.innerHTML = "";
    const term = normTR(filter.trim());
    let lastCategory = null;
    let shown = 0;
    EXAMS.forEach((exam, i) => {
        const category = exam.category || "FTR & Beyin Cerrahisi";
        let matchCount = 0;
        if (term) {
            const headMatch = normTR(category + " " + exam.title + " " + (exam.desc || "")).includes(term);
            matchCount = exam.questions.filter(q => normTR(q.q + " " + q.a.join(" ")).includes(term)).length;
            if (!headMatch && matchCount === 0) return;
        }
        if (category !== lastCategory) {
            const header = document.createElement("div");
            header.className = "exam-category";
            header.textContent = category;
            list.appendChild(header);
            lastCategory = category;
        }
        const item = document.createElement("div");
        item.className = "exam-item";
        item.onclick = () => startExam(i);
        item.innerHTML = `
            <div>
                <div class="exam-title">${exam.title}</div>
                <div class="exam-desc">${exam.desc || exam.questions.length + " soru"}</div>
                ${matchCount ? `<div class="exam-match">${matchCount} soruda "${filter.trim().replace(/[<>&"]/g, "")}" geçiyor</div>` : ""}
            </div>
            <div class="arrow">&#8594;</div>`;
        list.appendChild(item);
        shown++;
    });
    if (!shown) list.innerHTML = `<div class="no-result">Sonuç bulunamadı.</div>`;
}

function startExam(examIdx) {
    currentExam = examIdx;
    document.getElementById("exam-select-screen").style.display = "none";
    document.getElementById("quiz-header").style.display = "flex";
    document.getElementById("sidebar").style.display = "";
    document.getElementById("quiz-area").style.display = "";
    document.getElementById("result-screen").style.display = "none";
    document.getElementById("header-title").innerText = EXAMS[examIdx].title;
    document.body.classList.add("quiz-mode");
    initQuiz();
    window.scrollTo(0,0);
}

function goHome() {
    if (!quizFinished && userAnswers.some(a => a !== null)) {
        if (!confirm("Sınavdan çıkmak istediğinize emin misiniz? Cevaplarınız kaydedilmeyecek.")) return;
    }
    currentExam = null;
    document.body.classList.remove("quiz-mode");
    document.getElementById("quiz-header").style.display = "none";
    document.getElementById("sidebar").style.display = "none";
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("quiz-area").style.display = "none";
    document.getElementById("result-screen").style.display = "none";
    document.getElementById("exam-select-screen").style.display = "block";
    window.scrollTo(0,0);
}

function restartExam() {
    startExam(currentExam);
}

/* ===== QUIZ MOTORU ===== */
function initQuiz() {
    quizFinished = false;
    currentIdx = 0;
    const questions = EXAMS[currentExam].questions;

    // 1. Her sorunun şıklarını karıştır (ilk şık = doğru cevap işaretlenir)
    quizData = questions.map(q => {
        let options = q.a.map((opt, index) => ({ text: opt, isCorrect: index === 0 }));
        for (let i = options.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [options[i], options[j]] = [options[j], options[i]];
        }
        return { q: q.q, options: options };
    });

    // 2. Soru sırasını karıştır
    for (let i = quizData.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [quizData[i], quizData[j]] = [quizData[j], quizData[i]];
    }

    userAnswers = new Array(quizData.length).fill(null);
    renderSidebar();
    loadQuestion();
}

function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("open");
}

function closeSidebar(event) {
    document.getElementById("sidebar").classList.remove("open");
}

function renderSidebar() {
    const grid = document.getElementById("q-grid");
    grid.innerHTML = "";
    quizData.forEach((_, i) => {
        const badge = document.createElement("div");
        badge.className = `q-badge ${i === currentIdx ? 'active' : ''} ${userAnswers[i] !== null ? 'answered' : ''}`;
        badge.innerText = i + 1;
        badge.onclick = () => { jumpToQuestion(i); closeSidebar(); };
        grid.appendChild(badge);
    });
}

function loadQuestion() {
    if (quizFinished) return;

    const qData = quizData[currentIdx];
    document.getElementById("question").innerHTML = qData.q;
    document.getElementById("mobile-progress").innerText = `Soru ${currentIdx + 1} / ${quizData.length}`;
    document.getElementById("prev-btn").disabled = currentIdx === 0;
    document.getElementById("next-btn").disabled = currentIdx === quizData.length - 1;

    const optionsDiv = document.getElementById("options");
    optionsDiv.innerHTML = "";

    const hasAnswered = userAnswers[currentIdx] !== null;

    qData.options.forEach((opt, index) => {
        const div = document.createElement("div");
        let className = "option";
        if (hasAnswered) {
            if (opt.isCorrect) className += " correct";
            else if (userAnswers[currentIdx] === index) className += " wrong";
            div.style.cursor = "default";
        } else {
            div.onclick = () => selectOption(index);
        }
        div.className = className;
        div.innerHTML = `<strong>${String.fromCharCode(65 + index)})</strong> ${opt.text}`;
        optionsDiv.appendChild(div);
    });

    renderSidebar();
    if (window.innerWidth < 992) {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
}

function selectOption(idx) {
    if (userAnswers[currentIdx] !== null) return;
    userAnswers[currentIdx] = idx;
    loadQuestion();
}

function nextQuestion() {
    if (currentIdx < quizData.length - 1) { currentIdx++; loadQuestion(); }
}

function prevQuestion() {
    if (currentIdx > 0) { currentIdx--; loadQuestion(); }
}

function jumpToQuestion(i) {
    currentIdx = i;
    loadQuestion();
}

function finishQuiz() {
    if (!confirm("Sınavı bitirmek istediğinize emin misiniz?")) return;

    quizFinished = true;
    document.getElementById("quiz-area").style.display = "none";
    document.getElementById("sidebar").style.display = "none";
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("quiz-header").style.display = "none";
    document.getElementById("result-screen").style.display = "block";
    document.body.classList.remove("quiz-mode");
    window.scrollTo(0,0);

    let correctCount = 0;
    const reviewList = document.getElementById("review-list");
    reviewList.innerHTML = "";

    quizData.forEach((qData, i) => {
        const selectedIdx = userAnswers[i];
        const isCorrect = selectedIdx !== null && qData.options[selectedIdx].isCorrect;
        if (isCorrect) correctCount++;

        const item = document.createElement("div");
        item.className = "review-item";
        item.style.borderLeft = `4px solid ${isCorrect ? 'var(--success)' : 'var(--error)'}`;

        const correctOptIdx = qData.options.findIndex(o => o.isCorrect);
        let selectedText = "Boş Bırakıldı";
        if (selectedIdx !== null) {
            selectedText = `${String.fromCharCode(65 + selectedIdx)}) ${qData.options[selectedIdx].text}`;
        }
        const correctText = `${String.fromCharCode(65 + correctOptIdx)}) ${qData.options[correctOptIdx].text}`;

        item.innerHTML = `
            <div style="font-weight: 600; margin-bottom: 0.8rem; line-height: 1.4; color: var(--text);">Soru ${i + 1}: ${qData.q}</div>
            <div style="color: ${isCorrect ? 'var(--success)' : 'var(--error)'}; font-weight: ${isCorrect ? '500' : 'normal'}; margin-bottom: 0.3rem;">
                Senin Cevabın: ${selectedText}
            </div>
            ${!isCorrect ? `<div style="color: var(--success); font-weight: 500;">Doğru Cevap: ${correctText}</div>` : ''}
        `;
        reviewList.appendChild(item);
    });

    document.getElementById("score-summary").innerText = `Skor: ${correctCount} / ${quizData.length}`;
}

renderExamList();
</script>
